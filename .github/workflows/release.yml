# Builds the downloadable app for both platforms, publishes it as a GitHub
# prerelease for our own records, and pushes the installers and the update
# manifest to the R2 bucket that installed copies actually read.
#
# Three things about this workflow are deliberate and easy to undo by accident.
#
# First, it runs on a Windows runner. Not for convenience — the app cannot be
# cross-compiled. `ring`, underneath rustls, builds C, and there is no MSVC
# toolchain on a Mac, so the Windows installer can only be produced on
# Windows. The matrix is a requirement, not an optimisation.
#
# Second, two different signatures are in play here and they are not
# alternatives to each other:
#
#   - The updater signature (minisign, TAURI_SIGNING_PRIVATE_KEY) is what an
#     installed copy verifies before accepting an update. It is mandatory —
#     the plugin cannot be told to skip it — and it is what makes serving
#     these files from a bucket anybody can read safe.
#   - OS code signing (the APPLE_* secrets, and a certificate on Windows) is
#     what stops Gatekeeper and SmartScreen. It is still absent.
#
# So the artifacts here are signed for the updater and UNSIGNED for the
# operating system: testers still need the install notes in the README. On
# Windows that is worse than it sounds, because the updater runs the
# downloaded NSIS installer, so SmartScreen fires on every update rather than
# only on first install. Adding the six Apple secrets turns macOS code
# signing on without editing this file — but see the signing step for why
# they cannot simply be listed as build env.
#
# Third, the publish job exists because the repository used to be private:
# GitHub will not serve a private repo's release assets to an anonymous
# client, and an installed app is an anonymous client. The repository is
# public now, but the job stays — every installed copy is compiled to fetch
# from the R2 URL and cannot be re-pointed, so that URL must keep answering.
name: release

on:
  # A tag is the trigger, so publishing is a deliberate act and never a
  # side effect of merging. The tag must match the version in
  # package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml —
  # nothing here checks that for you, and the tag names the release while
  # the config names what is inside the binary.
  push:
    tags:
      - "v*"
  # Build the matrix without publishing, to prove a change compiles on
  # Windows before committing to a tag.
  #
  # Note that GitHub will not dispatch a workflow that is absent from the
  # default branch, whatever ref you aim it at, so this trigger is unusable
  # until this file is on main. That is the reason for the pull_request
  # trigger below rather than a preference for one over the other.
  workflow_dispatch:
  # The developer machine here is a Mac and the app cannot be cross-compiled,
  # so without this nobody finds out that a change broke Windows until after
  # a tag is pushed and testers are already downloading. Publishing is gated
  # on the ref being a tag, so a pull request run uploads nothing — and it
  # builds Windows alone, for the reason set out on the matrix below.
  #
  # Scoped to the things a build actually depends on: the daily crawl rewrites
  # hundreds of files under data/, and none of them can break a compile.
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release.yml"

# Releases are attached to a tag, so two runs for one tag would race to
# upload the same assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing should not delete the other platform's
      # artifacts. Testers on the working OS can start while the other is
      # fixed.
      fail-fast: false
      matrix:
        # Both platforms build on every pull request. It was Windows only
        # while the repository was private: Actions billed private repos per
        # OS (Linux 1x, Windows 2x, macOS 10x) against a 2,000-minute monthly
        # allowance, and at ~8.5 minutes a macOS build cost ~85 billed
        # minutes — enough that building both on every pull request was
        # about eighteen runs a month. The repository is public now and
        # standard runners on public repos are free, so the reason is gone.
        #
        # Windows is the platform that matters most here, either way. The
        # developer machine is a Mac, so `cargo test` and `npm run app`
        # exercise that target every time anyone works on this; nothing
        # exercises Windows — `ring` builds C, there is no MSVC toolchain on
        # a Mac, and the app cannot be cross-compiled — so this runner is the
        # only thing in the project that can report whether the Windows
        # build still stands. Building macOS as well catches a macOS-only
        # break before it lands on main rather than at the next tag.
        platform: ["macos-latest", "windows-latest"]

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Both Apple architectures, so one download serves Apple Silicon and
      # Intel. The alternative is two runners and two DMGs, and a tester
      # picking the wrong one gets an app that will not open. Windows needs
      # no extra target and an empty string is how this asks for none.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # A cold Rust build of the whole Tauri stack is most of this job's
      # runtime, and a beta gets rebuilt often. CI-only: nothing here is
      # linked into the app.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend tooling
        run: npm ci

      # tauri.conf.json points frontendDist at ../dist and does not know how
      # to produce it, so the TypeScript build has to happen before the Rust
      # one rather than as part of it.
      - name: Build the frontend
        run: npm run build

      # Until this step existed, nothing ran these tests on any machine but
      # the developer's: this workflow only built, and the crawler's Node
      # tests run on the ingest schedule. A release could be cut, and was,
      # over a suite nobody had run since the last time somebody typed
      # `cargo test` by hand.
      #
      # It sits here, before the long build, so a failure costs seconds
      # rather than the whole Tauri compile — and it runs on every platform
      # in the matrix, which means the suite now runs on Windows, where none
      # of it has ever executed. The toolchain and the cache are already warm
      # by this point, so it adds well under a minute.
      #
      # The OP.GG live tests stay behind `#[ignore]` and do not run here.
      # That is deliberate: CI must not depend on a third party being up, and
      # a run that reaches the network is not one you can trust to fail for
      # the reason it says. Run them by hand when the provider is in doubt —
      # `cargo test --test opgg_live -- --ignored`.
      - name: Test
        working-directory: src-tauri
        run: cargo test

      # Tauri decides to sign when APPLE_CERTIFICATE is *present*, not when it
      # holds anything, so handing the build an unset secret is not a no-op —
      # it fails in `security import` on an empty certificate. That is why the
      # variables are promoted here, only when there is something to promote,
      # instead of being listed in the build step's env where an
      # unconfigured repo cannot avoid them.
      - name: Configure Apple signing, if a certificate is available
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret; building unsigned."
            echo "Testers will need the install notes in the README."
            exit 0
          fi

          # Heredoc form because a certificate is multi-line. The delimiter is
          # deliberately not something base64 or a password could contain.
          {
            for pair in \
              "APPLE_CERTIFICATE:$CERTIFICATE" \
              "APPLE_CERTIFICATE_PASSWORD:$CERTIFICATE_PASSWORD" \
              "APPLE_SIGNING_IDENTITY:$SIGNING_IDENTITY" \
              "APPLE_ID:$NOTARY_APPLE_ID" \
              "APPLE_PASSWORD:$NOTARY_PASSWORD" \
              "APPLE_TEAM_ID:$TEAM_ID"
            do
              echo "${pair%%:*}<<__SPELLCHECK_EOF__"
              echo "${pair#*:}"
              echo "__SPELLCHECK_EOF__"
            done
          } >> "$GITHUB_ENV"
          echo "Apple signing configured; this build will be signed and notarised."

      # The release description used to be a literal in this file, which meant
      # every version shipped the same eleven lines of install warnings and
      # said nothing about what changed. CHANGELOG.md already holds that, so
      # it is read from there rather than written twice and kept in sync by
      # hand — which it was not.
      #
      # A missing entry warns rather than fails. The tag is already pushed by
      # the time this runs and the build behind it takes twenty minutes; a
      # release with thin notes is recoverable with `gh release edit`, and a
      # release that never happened because of a documentation slip is a worse
      # trade. The annotation is visible on the run summary.
      - name: Assemble the release description
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # Literal prefix match including the trailing space, so 0.1.2 does
          # not also match 0.1.20, and so the em dash in the heading never has
          # to survive a locale round trip.
          entry=$(awk -v v="$version" '
            index($0, "## " v " ") == 1 { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md)

          if [ -z "$(printf '%s' "$entry" | tr -d '[:space:]')" ]; then
            echo "::warning::CHANGELOG.md has no entry for $version; publishing install notes only"
            entry="Beta build."
          fi

          base="https://pub-7d8d63aa0eec43f5a16598403866eed1.r2.dev"
          {
            echo "body<<__SPELLCHECK_NOTES__"
            printf '%s\n' "$entry"
            cat <<NOTES

          ### Downloads

          - [macOS (universal)]($base/spellcheck_${version}_universal.dmg)
          - [Windows (x64)]($base/spellcheck_${version}_x64-setup.exe)

          The GitHub assets below are not downloadable without repository
          access — the links above are the ones that work.

          ---

          ### Installing

          These builds are unsigned, so both systems will try to stop you once.
          That is expected and not a sign of a bad download.

          - **macOS** — blocked on first open. System Settings → Privacy &
            Security → scroll down → **Open Anyway**.
          - **Windows** — SmartScreen shows "Windows protected your PC".
            **More info** → **Run anyway**.

          League does not need to be running to install or open the app. It
          waits for the client and says so when there isn't one.
          NOTES
            echo "__SPELLCHECK_NOTES__"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater archives. This is NOT code signing — it is the
          # minisign keypair the updater verifies against, and it is what
          # makes serving these files from a bucket anybody can read safe.
          # Without it the build still produces installers, but no .sig, and
          # an installed copy will refuse every update it is offered.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Only publish on a tag. A workflow_dispatch run builds the matrix
          # and uploads nothing.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: spellcheck ${{ github.ref_name }}
          # Assembled above from CHANGELOG.md. Empty on a non-tag run, which
          # is harmless: tagName is empty there too, so nothing publishes.
          releaseBody: ${{ steps.notes.outputs.body }}
          # A beta is not a release. This also keeps the repo's "latest
          # release" pointing at nothing until there is something to stand
          # behind.
          prerelease: true
          # Published straight away — a draft would be invisible to the
          # testers this workflow exists to serve.
          releaseDraft: false
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}

      # The updater artifacts have to outlive this job: the manifest names
      # both platforms and neither runner can see the other's output, so they
      # meet in the publish job below rather than here.
      - name: Keep the updater artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig

  # Distribution. The binaries live in an R2 bucket that answers anonymously,
  # a choice made while the repository was private (a private repo's release
  # assets need a GitHub account to download, which an installed copy does
  # not have and must never be given). The repository is public now, but the
  # bucket URL is baked into every installed copy, so it is the one place the
  # binaries must always be. The GitHub prerelease above is our own record of
  # what was built.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The manifest carries the signature itself, not a path or a URL to it,
      # so each .sig is read into the JSON here.
      - name: Build the update manifest
        id: manifest
        env:
          PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p upload

          mac=$(find artifacts -name '*.app.tar.gz' | head -1)
          win=$(find artifacts -name '*-setup.exe' | head -1)
          for f in "$mac" "$win"; do
            if [ -z "$f" ] || [ ! -f "$f.sig" ]; then
              echo "missing artifact or signature for $f" >&2
              exit 1
            fi
            cp "$f" "$f.sig" upload/
          done

          # The .dmg is what a person downloads and installs; the .app.tar.gz
          # above is only what the updater reads. The bar's Download button
          # builds this filename from the version, so a rename here silently
          # breaks it.
          dmg=$(find artifacts -name '*.dmg' | head -1)
          [ -n "$dmg" ] || { echo "no .dmg among the artifacts" >&2; exit 1; }
          cp "$dmg" upload/

          jq -n \
            --arg version "$version" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "spellcheck $GITHUB_REF_NAME" \
            --arg mac_url "$PUBLIC_URL/$(basename "$mac")" \
            --arg mac_sig "$(cat "$mac.sig")" \
            --arg win_url "$PUBLIC_URL/$(basename "$win")" \
            --arg win_sig "$(cat "$win.sig")" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-universal": { signature: $mac_sig, url: $mac_url },
                "darwin-aarch64":   { signature: $mac_sig, url: $mac_url },
                "darwin-x86_64":    { signature: $mac_sig, url: $mac_url },
                "windows-x86_64":   { signature: $win_sig, url: $win_url }
              }
            }' > latest.json
          cat latest.json

      # Binaries first, manifest last, and never in one sweep. A manifest
      # that lands before the file it names is a manifest that sends every
      # installed copy at a 404.
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp upload/ "s3://$BUCKET/" --recursive --endpoint-url "$ENDPOINT"
          aws s3 cp latest.json "s3://$BUCKET/latest.json" \
            --cache-control 'no-cache' --endpoint-url "$ENDPOINT"
