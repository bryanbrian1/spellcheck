[package]
name = "spellcheck"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
description = "Champion select build lookup for League of Legends"
publish = false

[lib]
name = "spellcheck"
path = "src/lib.rs"

[[bin]]
name = "spellcheck"
path = "src/main.rs"

# Tauri generates the app metadata (icons, Info.plist, capabilities) at build
# time from tauri.conf.json.
# Release builds are what people download, so they are tuned for size. The
# app was 14MB of binary on the default profile, which is most of a 4.3MB
# download for a program whose own source is eleven thousand lines.
#
# opt-level stays at the default 3 rather than dropping to "z". Size matters
# here, but so does the app feeling instant on a machine that cannot spare a
# core, and "z" buys a megabyte or so by making the code slower.
#
# panic is deliberately NOT set to "abort", though it would save more. This
# app's job is to sit in the background for hours; unwinding means a panic in
# the watcher task kills that task, while aborting would kill the whole app
# out from under somebody in champion select. The megabyte is not worth that.
[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Serialization of the internal build schema and of every provider payload.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Typed provider errors without hand-writing Display/Error impls.
thiserror = "2"
# `dyn BuildDataProvider` needs object-safe async methods.
async-trait = "0.1"
# Async runtime primitives. Only the features we use: Mutex for the MCP
# session, fs for reading build files off the UI thread.
tokio = { version = "1", features = ["sync", "fs", "rt", "macros", "net", "time"] }
# The LCU authenticates with HTTP Basic and the lockfile password, and the
# WebSocket upgrade carries that header by hand, so we encode it ourselves.
base64 = "0.22"
# HTTP client for the OP.GG MCP endpoint. rustls avoids linking OpenSSL;
# the same client will serve the LCU HTTP calls later.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# The desktop shell. This is the whole GUI stack: Tauri renders the UI in the
# system WebView (WKWebView on macOS), so no browser engine ships in the
# binary. That is what keeps us inside the 120MB budget.
tauri = { version = "2", features = [] }
# Self-update: checks a manifest on our own bucket, verifies the archive's
# signature against the public key in tauri.conf.json, and swaps the app.
# Pulled in for the whole updater stack rather than hand-rolled because the
# signature verification is the load-bearing part and is not worth
# reimplementing.
tauri-plugin-updater = "2"
# The champ select listener. The client pushes changes over a WebSocket and
# reqwest cannot speak that protocol, so this is the one new stack the LCU
# layer needs. It is configured against rustls, which reqwest already pulls
# in, so no second TLS implementation is linked. futures-util supplies the
# Stream/Sink traits the socket is driven through, and rustls is named
# directly only to build the loopback certificate verifier in lcu/ws.rs.
#
# __rustls-tls rather than rustls-tls-webpki-roots: we hand the connector our
# own TLS config, so a bundled root store would be a second copy of a quarter
# megabyte of certificates we never consult. The feature is underscored but
# declared in the crate's manifest, and the version is pinned.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "__rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
