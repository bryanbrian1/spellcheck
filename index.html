<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>leaguechecker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">

  <!-- Champ select now drives itself: locking a champion switches to that
       screen on its own. The strip stays because Search has to work with no
       client running at all, and because In game is still a preview. -->
  <div class="modes" role="group" aria-label="Mode">
    <button data-go="search" aria-pressed="true">Search</button>
    <button data-go="select" aria-pressed="false">Champ select</button>
    <button data-go="game" aria-pressed="false">In game</button>
  </div>

  <!-- ============ SEARCH — live, wired to the provider ============ -->
  <section class="screen on" id="s-search">
    <div class="search-wrap">
      <input class="input" id="champ" placeholder="Search a champion" aria-label="Champion" autocomplete="off" spellcheck="false">
      <div class="roles" role="group" aria-label="Role" id="roles">
        <button class="role" data-role="top" aria-pressed="false">Top</button>
        <button class="role" data-role="jungle" aria-pressed="false">Jungle</button>
        <button class="role" data-role="middle" aria-pressed="true">Mid</button>
        <button class="role" data-role="bottom" aria-pressed="false">Bot</button>
        <button class="role" data-role="utility" aria-pressed="false">Support</button>
      </div>
    </div>

    <div class="body" id="results">
      <div class="empty"><p>Type a champion and pick a role.</p></div>
    </div>

    <div class="foot">
      <button class="btn" id="import-runes" disabled>Import runes</button>
      <button class="btn" id="import-items" disabled>Import items</button>
    </div>
  </section>

  <!-- ============ CHAMP SELECT — live, driven by the LCU events ============ -->
  <section class="screen" id="s-select">
    <div class="hdr">
      <div class="portrait" id="select-portrait">&mdash;</div>
      <div class="hdr-main">
        <div class="hdr-name" id="select-name">Champ select</div>
        <div class="hdr-sub" id="select-sub">Waiting for the League client</div>
      </div>
      <span class="pill off" id="select-pill">Offline</span>
    </div>

    <div class="body" id="select-body">
      <div class="empty"><p>League isn&#39;t running. This screen fills itself when you lock a champion.</p></div>
    </div>

    <div class="foot">
      <button class="btn pri" id="select-import-runes" disabled>Import runes</button>
      <button class="btn" id="select-import-items" disabled>Import items</button>
    </div>
  </section>

  <!-- ============ IN GAME — preview, phase 3 ============ -->
  <section class="screen" id="s-game">
    <div class="hdr">
      <div class="portrait" id="game-portrait">&mdash;</div>
      <div class="hdr-main">
        <div class="hdr-name" id="game-name">In game</div>
        <div class="hdr-sub" id="game-sub">Waiting for a game</div>
      </div>
      <span class="pill off" id="game-pill">No game</span>
    </div>

    <div class="body" id="game-body"></div>

    <div class="foot">
      <button class="btn" id="game-import-items" disabled>Import items</button>
    </div>
  </section>

</div>
<script type="module" src="./main.js"></script>
</body>
</html>
