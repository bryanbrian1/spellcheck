<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>leaguechecker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">

  <!-- Two screens, not three. Champ select and the game are one run of
       League and one screen here: it fills in when you lock a champion and
       keeps going once the match starts, adding to what is already there
       rather than starting again somewhere else. It drives itself, so the
       strip exists only because Search has to work with no client at all. -->
  <div class="modes" role="group" aria-label="Mode">
    <button data-go="search" aria-pressed="true">Search</button>
    <button data-go="live" aria-pressed="false">Live</button>
  </div>

  <!-- ============ SEARCH — live, wired to the provider ============ -->
  <section class="screen on" id="s-search">
    <div class="search-wrap">
      <input class="input" id="champ" placeholder="Search a champion" aria-label="Champion"
             autocomplete="off" spellcheck="false" role="combobox"
             aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
      <ul class="suggest" id="suggest" role="listbox" aria-label="Champion matches" hidden></ul>
      <div class="roles" role="group" aria-label="Role" id="roles">
        <button class="role" data-role="top" aria-pressed="false">Top</button>
        <button class="role" data-role="jungle" aria-pressed="false">Jungle</button>
        <button class="role" data-role="middle" aria-pressed="true">Mid</button>
        <button class="role" data-role="bottom" aria-pressed="false">Bot</button>
        <button class="role" data-role="utility" aria-pressed="false">Support</button>
      </div>
    </div>

    <div class="body" id="results">
      <div class="empty"><p>Type a champion and pick a role.</p></div>
    </div>

    <div class="foot">
      <button class="btn" id="import-runes" disabled>Import runes</button>
      <button class="btn" id="import-items" disabled>Import items</button>
    </div>
  </section>

  <!-- ============ LIVE — champ select and the game, one screen ============ -->
  <section class="screen" id="s-live">
    <div class="hdr">
      <div class="portrait" id="live-portrait">&mdash;</div>
      <div class="hdr-main">
        <div class="hdr-name" id="live-name">Live</div>
        <div class="hdr-sub" id="live-sub">Waiting for the League client</div>
      </div>
      <span class="pill off" id="live-pill">Offline</span>
    </div>

    <div class="body" id="live-body">
      <div class="empty"><p>League isn&#39;t running. This screen fills itself when you lock a champion.</p></div>
    </div>

    <div class="foot">
      <button class="btn pri" id="live-import-runes" disabled>Import runes</button>
      <button class="btn" id="live-import-items" disabled>Import items</button>
    </div>
  </section>

</div>
<script type="module" src="./main.js"></script>
</body>
</html>
